<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Rápido</title>
  <style>
    body { width: 220px; font-family: sans-serif; padding: 12px; margin: 0; background: #f9fafb; }
    h4 { margin: 0 0 8px 0; font-size: 14px; }
    select, button { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #d1d5db; }
    button { background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h4>Perfil de Usuario</h4>
  <select id="userSelect"></select>
  <button id="openAdminBtn" style="display: none;">Abrir Panel Web Admin</button>

  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script src="logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
